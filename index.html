<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ЧЕРНЕТКА: title і description — уточнити фінальні тексти -->
  <title>LM Бухгалтерські послуги — бухгалтерський супровід у Львові</title>
  <meta name="description" content="Бухгалтерський супровід для ФОП і компаній у Львові: облік, звітність, податки, консультації. Залиште заявку — зателефонуємо й обговоримо співпрацю.">
  <meta name="theme-color" content="#E30613">

  <!-- Клас .js потрібен, щоб ховати елементи для анімацій лише коли JS працює -->
  <script>document.documentElement.classList.add('js');</script>

  <!-- Шрифт: один варіативний файл на всі накреслення -->
  <link rel="preload" href="fonts/Onest-Variable.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon (червоний) -->
  <link rel="icon" href="images/favicon/favicon-red.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon/favicon-red-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="images/favicon/favicon-red-180.png">

  <!-- Open Graph -->

  <meta property="og:type" content="website">
  <meta property="og:locale" content="uk_UA">

  <meta property="og:title" content="LM Бухгалтерські послуги — бухгалтерський супровід у Львові">

  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Структуровані дані. FAQPage додамо разом із секцією питань -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "AccountingService",
    "name": "LM Бухгалтерські послуги",
    "telephone": "+380672084631",
    "image": "images/og-image.jpg",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Львів",
      "addressCountry": "UA"

  <!-- 10. Footer -->

    </div>
